name: Validate example
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - run: npm run typecheck
      - run: npm test
